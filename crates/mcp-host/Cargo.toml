[package]
name = "mcp-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP host: built-in and external tool servers, the tool registry, config import (ARCHITECTURE.md 9)."

[lib]
name = "mcp_host"
path = "src/lib.rs"

[dependencies]
policy = { workspace = true }
runtime = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-util = { workspace = true }
rmcp = { workspace = true }
process-wrap = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
url = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
# Checks that image results from servers are valid base64 before they reach the model.
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "test-util"] }

# Doubles as the fake MCP server it starts through the host (see the file header).
[[test]]
name = "stdio_e2e"
path = "tests/stdio_e2e.rs"
harness = false

# The app's own managed server (rea, item5-spec.md WP9b); doubles as a hand-written fake
# MCP server that records every line it receives (see the file header).
[[test]]
name = "managed_e2e"
path = "tests/managed_e2e.rs"
harness = false

[lints]
workspace = true
