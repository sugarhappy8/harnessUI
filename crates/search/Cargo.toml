[package]
name = "search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Web search for the model: search providers, a guarded page fetcher, text extraction, passage ranking, project library versions and official documentation hosts."

[lib]
name = "search"
path = "src/lib.rs"

[features]
# Tests only: lets this crate's integration tests serve pages from 127.0.0.1 on chosen
# ports and give host names fixed addresses. Never enabled by the app; see
# `Fetcher::with_test_loopback_ports`.
test-hooks = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "macros", "sync"] }
futures-util = { workspace = true }
# The content hash of a page's extracted text.
sha2 = { workspace = true }
# Version patterns in addresses, titles and requirement strings.
regex = { workspace = true }
# HTML to a DOM (html5ever underneath). The same versions Tauri builds with.
dom_query = { workspace = true }
html5ever = { workspace = true }
# Cargo.toml, Cargo.lock and pyproject.toml.
toml = { workspace = true }
# Pages that are not UTF-8. Already built for reqwest.
encoding_rs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# The integration tests need the test hooks of this very crate.
search = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
