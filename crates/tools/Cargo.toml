[package]
name = "tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mcp-host = { workspace = true }
policy = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# Hash recorded with each write preview, re-checked before the write.
sha2 = { workspace = true }
# Unified diffs on write and edit cards.
similar = { workspace = true }
# search_files with regex = true.
regex = { workspace = true }
thiserror = { workspace = true }
# SKILL.md frontmatter (YAML); serde_yml is RUSTSEC-flagged.
serde-saphyr = { workspace = true }
serde = { workspace = true }
# Skill zip import with the format's limits.
zip = { workspace = true }
# Validating git remote URLs (https and ssh only).
url = { workspace = true }
# PowerShell -EncodedCommand (base64 of UTF-16LE): no quoting can change what runs.
base64 = { workspace = true }
# Starting the PDF worker through the one spawn module.
runtime = { workspace = true }
# PDF text extraction in pure Rust, run only inside the worker process (8.6).
pdf-extract = { workspace = true }
# The git tools' libgit2 fallback for machines without git (9.3).
git2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# libgit2-sys calls openssl_sys::init() on every Unix, macOS included, although its TLS
# there is SecureTransport; build OpenSSL from source and link it statically so the app
# never loads a Homebrew libssl/libcrypto (9.3 build note).
git2 = { workspace = true, features = ["vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
# setrlimit: the PDF worker's memory cap.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# A Job Object memory limit for the PDF worker; same major as Tauri.
windows = { version = "0.62", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
zip = { workspace = true }
tempfile = { workspace = true }
dunce = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Doubles as the PDF worker when started with the hidden flag.
[[test]]
name = "pdf_worker"
path = "tests/pdf_worker.rs"
harness = false

[lints]
workspace = true
