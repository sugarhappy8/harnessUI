[package]
name = "agent"
description = "Providers (llama-server and OpenAI-compatible endpoints) and the agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
mcp-host.workspace = true
policy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# Validates tool arguments in the fake tool hosts of the tests (default features off: no
# network or file `$ref` resolution, as in mcp-host).
jsonschema.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
