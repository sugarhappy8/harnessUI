name: Release

# Builds the signed (when secrets exist) Windows installer and the universal macOS disk
# image (Apple silicon and Intel in one file) on every version tag and attaches them to a
# draft GitHub release. With the updater key it also signs and uploads the model catalog.
# A final job checks the draft has everything and only then publishes it, so a release
# that failed a check is never public. Pushing the tag is the decision to release; so is
# starting this workflow by hand (Actions, Release, Run workflow) on the commit to release:
# the tag v<version> is then created from exactly that commit when the release is
# published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job conditions cannot read secrets, so this job says which keys are configured.
  keys:
    name: Signing keys
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      updater: ${{ steps.check.outputs.updater }}
    steps:
      - name: Is the updater key set?
        id: check
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            echo "Updater key: set"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "Updater key: not set"
          fi

  publish:
    name: Publish (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis
          # One disk image for every Mac, as in ci.yml: the app and the llama.cpp sidecars
          # are built for both processors and joined.
          - name: macOS
            os: macos-26
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned llama.cpp runtime is not in the repository (ARCHITECTURE.md 7.1); the
      # bundle needs it, as in ci.yml. Only the Windows download is cached: fetch_llama.py
      # checks it against the SHA-256 in llama.lock.json on every run. The macOS binaries
      # are always built fresh from the pinned commit for a release, for both processors.
      - name: Cache the llama.cpp download (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/llama
          key: release-llama-${{ matrix.target }}-${{ hashFiles('llama.lock.json', 'scripts/fetch_llama.py') }}
      - name: llama.cpp runtime (Windows, pinned Vulkan + CPU build)
        if: runner.os == 'Windows'
        run: python scripts/fetch_llama.py windows
      - name: llama.cpp runtime (macOS, built from the pinned commit for both processors)
        if: runner.os == 'macOS'
        run: python3 scripts/fetch_llama.py macos
      # Signing secrets are placeholders until the owner adds them (README, "Signing").
      # An unset secret arrives as an empty string, which the Tauri CLI would treat as
      # "set" and then fail on, so only non-empty values are exported.
      - name: Export signing secrets that exist
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              delim="EOF_$RANDOM$RANDOM"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          done
      # Updates: with the updater signing key set as a secret and its public key committed in
      # src-tauri/tauri.updater.conf.json, the build also produces signed update artifacts
      # and latest.json. A key without a committed public key stops the release.
      - name: Updater configuration
        id: updater
        shell: bash
        run: |
          pubkey=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.updater.conf.json'))['plugins']['updater']['pubkey'])")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ -z "$pubkey" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but tauri.updater.conf.json has no public key"; exit 1
            fi
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "No updater key: this release has no in-app updates."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "Windows: download the file ending in -setup.exe (Windows 10 or 11, 64-bit). Mac: download the file ending in _universal.dmg (macOS 13.3 or later, Apple silicon or Intel). These builds are not code-signed: on Windows choose More info, then Run anyway; on a Mac right-click the app and choose Open. See README.md for details and CHANGELOG.md for what is in this version."
          releaseDraft: true
          prerelease: false
          # When started by hand there is no tag yet: it must point at the commit built here,
          # not at the default branch.
          releaseCommitish: ${{ github.sha }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
      # The draft already has the disk image at this point. A bundle that is missing a
      # processor, or that loads a library from outside the system, fails the run here so
      # the draft is not published (the verify job below does not run after a failure).
      - name: App bundle is universal and links system libraries only (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          python3 scripts/fetch_llama.py check-macos-app "$app"

  # Catalog Refresh (src-tauri/src/hub.rs) downloads models.json and models.json.minisig
  # from the latest release and accepts them only if the signature verifies against the
  # updater public key. `tauri signer sign` writes the base64 minisign signature the app
  # accepts.
  catalog:
    name: Sign and upload the catalog
    needs: [keys, publish]
    if: needs.keys.outputs.updater == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The password is always passed, empty when the key has none, so the signer never
      # waits for a password prompt.
      - name: Sign catalog/models.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-catalog
          cp catalog/models.json release-catalog/models.json
          npx tauri signer sign release-catalog/models.json > /dev/null
          mv release-catalog/models.json.sig release-catalog/models.json.minisig
      # A key pair that does not match the committed public key would make every Refresh
      # fail, so compare the key ids before uploading.
      - name: Signature matches the committed public key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json

          def key_bytes(text):
              t = text.strip()
              try:
                  decoded = base64.b64decode(t, validate=True).decode()
                  if decoded.startswith("untrusted comment:"):
                      t = decoded
              except ValueError:
                  pass
              if t.startswith("untrusted comment:"):
                  t = t.splitlines()[1]
              return base64.b64decode(t)

          conf = json.load(open("src-tauri/tauri.updater.conf.json"))
          public = key_bytes(conf["plugins"]["updater"]["pubkey"])
          signature = key_bytes(open("release-catalog/models.json.minisig").read())
          if public[2:10] != signature[2:10]:
              raise SystemExit("::error::the updater signing key does not match the public key in tauri.updater.conf.json")
          print("The catalog signature matches the committed public key.")
          PY
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          gh release upload "$tag" release-catalog/models.json release-catalog/models.json.minisig --clobber --repo "$GITHUB_REPOSITORY"

  # Fails the run when the draft release is incomplete: an installer missing, and with
  # the updater key, latest.json without every platform or the catalog missing. Reading a
  # draft release needs the workflow's write permission.
  #
  # The macOS build is universal, so tauri-action lists the same update archive under both
  # darwin-aarch64 and darwin-x86_64 (and darwin-universal, which no updater asks for). An
  # Intel Mac asks for darwin-x86_64: without that entry it would never see an update.
  verify:
    name: Verify and publish the release
    needs: [keys, publish, catalog]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.publish.result == 'success' && needs.catalog.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER: ${{ needs.keys.outputs.updater }}
        run: |
          tag="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $tag:"
          echo "$assets"
          fail=0
          has() { grep -qxF "$1" <<< "$assets"; }
          grep -qE -- '-setup\.exe$' <<< "$assets" || { echo "::error::$tag has no Windows installer"; fail=1; }
          grep -qE -- '\.dmg$' <<< "$assets" || { echo "::error::$tag has no macOS disk image"; fail=1; }
          grep -qE -- '_universal\.dmg$' <<< "$assets" || { echo "::error::$tag has no universal macOS disk image (Apple silicon and Intel)"; fail=1; }
          if [ "$UPDATER" = "true" ]; then
            for name in latest.json models.json models.json.minisig; do
              has "$name" || { echo "::error::$tag has no $name"; fail=1; }
            done
            if has latest.json; then
              mkdir -p release-check
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-check
              if ! jq -e '.platforms["windows-x86_64"] and .platforms["darwin-aarch64"] and .platforms["darwin-x86_64"]' release-check/latest.json > /dev/null; then
                echo "::error::latest.json must list windows-x86_64, darwin-aarch64 and darwin-x86_64"
                jq '.platforms | keys' release-check/latest.json || true
                fail=1
              fi
            fi
            if has models.json; then
              mkdir -p release-check
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern models.json --dir release-check
              cmp -s release-check/models.json catalog/models.json || { echo "::error::models.json on $tag differs from catalog/models.json"; fail=1; }
            fi
          else
            echo "No updater key: skipping the latest.json and catalog checks."
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::$tag stays a draft: fix the problems above, then run this workflow again."
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $tag."
