name: Release

# Builds the Windows installer and the universal macOS disk image (Apple silicon and Intel
# in one file) on every version tag and attaches them to a draft GitHub release, each one
# twice: under its own name with the version, and as a copy under a name that never
# changes (STABLE_WINDOWS and STABLE_MAC below). So releases/latest/download/<that name>
# always gives the newest installer; harnessui.site's Download button links there.
# Every release can update itself: the build signs the update files with the updater key
# and adds latest.json, which installed copies (0.0.8 and later) read to find a newer
# version, and the model catalog is signed and attached too. The first job stops the
# release, before anything is built, when the key's secret or its public key in
# src-tauri/tauri.updater.conf.json is missing (README, "In-app updates"). Apple's signing
# secrets are used when they exist.
# A final job checks the draft has everything and only then publishes it, so a release
# that failed a check is never public. Pushing the tag is the decision to release; so is
# starting this workflow by hand (Actions, Release, Run workflow) on the commit to release:
# the tag v<version> is then created from exactly that commit when the release is
# published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# The installers' names without the version. They stay the same on purpose: the website and
# the README link to them, so a renamed app keeps these names.
env:
  STABLE_WINDOWS: harnessUI-setup.exe
  STABLE_MAC: harnessUI-universal.dmg

jobs:
  # Every release must be able to update itself, so nothing is built without the updater
  # key: its private half as a secret and its public half committed. Job conditions cannot
  # read secrets, so this job checks them and fails.
  keys:
    name: Updater key
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The updater key is set and its public key is committed
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          fail=0
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater key: set"
          else
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. Every release must be able to update itself, so it needs the updater key: see README.md, \"In-app updates\", and run python3 -I scripts/setup_updater.py (on Windows: py scripts\\setup_updater.py or python scripts\\setup_updater.py) once on your own computer."
            fail=1
          fi
          if message=$(python3 -I scripts/setup_updater.py --check); then
            echo "$message"
          else
            echo "::error::$message"
            fail=1
          fi
          exit "$fail"

  # Before anything is built or published: reverse.lock.json must carry every publisher
  # check a release needs, and the digest GitHub publishes for the pinned Ghidra download
  # (recorded from CI run 43380365172) must still match it. Each release build reads that
  # digest itself, with the workflow's token, read-only in this job.
  reverse-pins:
    name: Reverse-engineering downloads are checked
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reverse.lock.json is ready for a release
        run: python3 -I scripts/pin_reverse.py --check --release
      - name: Ghidra's release digest on GitHub matches reverse.lock.json
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/pin_reverse.py github-digest --part ghidra

  publish:
    name: Publish (${{ matrix.name }})
    needs: [keys, reverse-pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            # Where the installer is built.
            bundle: target/release/bundle/nsis
            pattern: "*-setup.exe"
          # One disk image for every Mac, as in ci.yml: the app and the llama.cpp sidecars
          # are built for both processors and joined.
          - name: macOS
            os: macos-26
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: target/universal-apple-darwin/release/bundle/dmg
            pattern: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What's new: this version's entry in CHANGELOG.md as plain text, without the download
      # paragraph (scripts/release_notes.py app). tauri-action copies the release body into
      # latest.json as `notes`, which the app shows as plain text under "What's new" in its
      # update box. The release page gets the entry as written and where to download from the
      # verify job, when it publishes the release. A missing entry stops the run here, before
      # the build. A long entry is shortened: an action's input must fit in one environment
      # variable, which Windows limits to 32,767 characters.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: python3 -I scripts/release_notes.py app
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned llama.cpp runtime is not in the repository (ARCHITECTURE.md 7.1); the
      # bundle needs it, as in ci.yml. Only the Windows download is cached: fetch_llama.py
      # checks it against the SHA-256 in llama.lock.json on every run. The macOS binaries
      # are always built fresh from the pinned commit for a release, for both processors.
      - name: Cache the llama.cpp download (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/llama
          key: release-llama-${{ matrix.target }}-${{ hashFiles('llama.lock.json', 'sd.lock.json', 'scripts/fetch_llama.py', 'scripts/fetch_sd.py') }}
      - name: llama.cpp runtime (Windows, pinned Vulkan + CPU build)
        if: runner.os == 'Windows'
        run: python scripts/fetch_llama.py windows
      - name: llama.cpp runtime (macOS, built from the pinned commit for both processors)
        if: runner.os == 'macOS'
        run: python3 scripts/fetch_llama.py macos
      # The Studio engine's sd-cli (sd.lock.json), built the same way and bundled beside
      # llama-server. On Windows the app downloads the engine with the first local model.
      - name: Studio engine (macOS, sd-cli built from the pinned commit for both processors)
        if: runner.os == 'macOS'
        run: python3 scripts/fetch_sd.py macos
      # The updater key is always set (the keys job checked it). Apple's signing secrets
      # are placeholders until the owner adds them (README, "Signing"). An unset secret
      # arrives as an empty string, which the Tauri CLI would treat as "set" and then fail
      # on, so only non-empty values are exported.
      - name: Export signing secrets that exist
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              delim="EOF_$RANDOM$RANDOM"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          done
      # tauri.updater.conf.json adds the public key and the address of latest.json, so the
      # build also makes signed update files, and tauri-action attaches them with latest.json.
      - name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # When started by hand there is no tag yet: it must point at the commit built here,
          # not at the default branch.
          releaseCommitish: ${{ github.sha }}
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
      # The copy under the name that never changes. The installer must be the only one in
      # its folder and carry this version in its name, or the run stops. The version is
      # written without a newline: Python on Windows ends a printed line with CR LF, and
      # bash's $(...) removes only the LF, so the CR would stay in the version and the tag.
      - name: Upload the installer under its name without the version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ matrix.bundle }}
          PATTERN: ${{ matrix.pattern }}
          STABLE: ${{ matrix.name == 'Windows' && env.STABLE_WINDOWS || env.STABLE_MAC }}
        run: |
          version=$(python3 -c "import json,sys;sys.stdout.write(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="v$version"
          shopt -s nullglob
          # shellcheck disable=SC2206 # PATTERN is a glob on purpose
          found=("$BUNDLE"/$PATTERN)
          echo "In $BUNDLE: ${found[*]:-nothing}"
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one $PATTERN in $BUNDLE, found ${#found[@]}"
            exit 1
          fi
          case "$(basename "${found[0]}")" in
            *"_${version}_"*) ;;
            *) echo "::error::${found[0]} is not the installer of version $version"; exit 1 ;;
          esac
          mkdir -p release-stable
          cp "${found[0]}" "release-stable/$STABLE"
          gh release upload "$tag" "release-stable/$STABLE" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $(basename "${found[0]}") as $STABLE to $tag."
      # The draft already has the disk image at this point. A bundle that is missing a
      # processor, or that loads a library from outside the system, fails the run here so
      # the draft is not published (the verify job below does not run after a failure).
      - name: App bundle is universal and links system libraries only (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          python3 scripts/fetch_llama.py check-macos-app "$app"

  # Catalog Refresh (src-tauri/src/hub.rs) downloads models.json and models.json.minisig
  # from the latest release and accepts them only if the signature verifies against the
  # updater public key. `tauri signer sign` writes the base64 minisign signature the app
  # accepts. Every release has the updater key, so this runs every time.
  catalog:
    name: Sign and upload the catalog
    needs: [keys, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The password is always passed, empty when the key has none, so the signer never
      # waits for a password prompt.
      - name: Sign catalog/models.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-catalog
          cp catalog/models.json release-catalog/models.json
          npx tauri signer sign release-catalog/models.json > /dev/null
          mv release-catalog/models.json.sig release-catalog/models.json.minisig
      # A key pair that does not match the committed public key would make every Refresh
      # fail, and every update too, so compare the key ids before uploading.
      - name: Signature matches the committed public key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json

          def key_bytes(text):
              t = text.strip()
              try:
                  decoded = base64.b64decode(t, validate=True).decode()
                  if decoded.startswith("untrusted comment:"):
                      t = decoded
              except ValueError:
                  pass
              if t.startswith("untrusted comment:"):
                  t = t.splitlines()[1]
              return base64.b64decode(t)

          conf = json.load(open("src-tauri/tauri.updater.conf.json"))
          public = key_bytes(conf["plugins"]["updater"]["pubkey"])
          signature = key_bytes(open("release-catalog/models.json.minisig").read())
          if public[2:10] != signature[2:10]:
              raise SystemExit("::error::the updater signing key does not match the public key in tauri.updater.conf.json")
          print("The catalog signature matches the committed public key.")
          PY
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(python3 -c "import json,sys;sys.stdout.write(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          gh release upload "$tag" release-catalog/models.json release-catalog/models.json.minisig --clobber --repo "$GITHUB_REPOSITORY"

  # Fails the run when the draft release is incomplete: an installer missing, a copy under
  # the name without the version missing or not the same file as its twin, latest.json
  # without every platform or pointing at a file the release does not have, or the catalog
  # missing. Otherwise it publishes the release with the page's notes (the CHANGELOG.md
  # entry as written, then where to download). Reading a draft release needs the
  # workflow's write permission.
  #
  # The macOS build is universal, so tauri-action lists the same update archive under both
  # darwin-aarch64 and darwin-x86_64 (and darwin-universal, which no updater asks for). An
  # Intel Mac asks for darwin-x86_64: without that entry it would never see an update.
  verify:
    name: Verify and publish the release
    needs: [keys, publish, catalog]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import json,sys;sys.stdout.write(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="v$version"
          # One line per file: name, size, SHA-256 (when GitHub gives it), address in GitHub's API.
          listing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, (.size | tostring), (.digest // ""), .apiUrl] | @tsv')
          assets=$(cut -f1 <<< "$listing")
          echo "Assets on $tag:"
          echo "$assets"
          fail=0
          has() { grep -qxF "$1" <<< "$assets"; }
          field() { awk -F'\t' -v name="$1" -v col="$2" '$1 == name { print $col }' <<< "$listing"; }
          count() { grep -c . <<< "$1"; }
          # The installers as tauri-action named them, with the version. The copies without
          # it (harnessUI-setup.exe also ends in -setup.exe) must not count here.
          v=${version//./\\.}
          windows=$(grep -E -- "_${v}_[^_]*-setup\.exe$" <<< "$assets" || true)
          mac=$(grep -E -- "_${v}_universal\.dmg$" <<< "$assets" || true)
          [ "$(count "$windows")" -eq 1 ] || { echo "::error::$tag must have exactly one Windows installer named ..._${version}_x64-setup.exe"; fail=1; }
          [ "$(count "$mac")" -eq 1 ] || { echo "::error::$tag must have exactly one universal macOS disk image (Apple silicon and Intel) named ..._${version}_universal.dmg"; fail=1; }
          # Each copy under the name without the version is the same file as its twin.
          same() {
            local copy=$1 twin=$2
            if ! has "$copy"; then
              echo "::error::$tag has no $copy (the download address without the version)"; fail=1; return 0
            fi
            [ "$(count "$twin")" -eq 1 ] || return 0
            if [ "$(field "$copy" 2)" != "$(field "$twin" 2)" ]; then
              echo "::error::$copy ($(field "$copy" 2) bytes) and $twin ($(field "$twin" 2) bytes) on $tag are not the same file"; fail=1; return 0
            fi
            local a b
            a=$(field "$copy" 3); b=$(field "$twin" 3)
            if [ -n "$a" ] && [ -n "$b" ] && [ "$a" != "$b" ]; then
              echo "::error::$copy and $twin on $tag are not the same file ($a, $b)"; fail=1; return 0
            fi
            echo "$copy is the same file as $twin."
          }
          same "$STABLE_WINDOWS" "$windows"
          same "$STABLE_MAC" "$mac"
          for name in latest.json models.json models.json.minisig; do
            has "$name" || { echo "::error::$tag has no $name"; fail=1; }
          done
          if has latest.json; then
            mkdir -p release-check
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-check --clobber
            if ! jq -e --arg v "$version" '.version == $v' release-check/latest.json > /dev/null; then
              echo "::error::latest.json is for version $(jq -r '.version' release-check/latest.json), not $version"; fail=1
            fi
            # tauri-action points each entry at its file's address in GitHub's API, which
            # ends in the file's id.
            for platform in windows-x86_64 darwin-aarch64 darwin-x86_64; do
              url=$(jq -r --arg p "$platform" '.platforms[$p].url // ""' release-check/latest.json)
              signature=$(jq -r --arg p "$platform" '.platforms[$p].signature // ""' release-check/latest.json)
              if [ -z "$url" ] || [ -z "$signature" ]; then
                echo "::error::latest.json must list $platform with an address and a signature"; fail=1; continue
              fi
              # `tauri build` writes the version into the signed comment of each update file,
              # and installed copies (requireSignedVersion in tauri.updater.conf.json) refuse
              # a file whose signed version is missing or not the one latest.json announces.
              signed=$(base64 -d <<< "$signature" 2>/dev/null | sed -n 's/^trusted comment: //p' | tr '\t' '\n' | sed -n 's/^version://p')
              if [ "$signed" != "$version" ]; then
                echo "::error::latest.json's $platform signature is for version '${signed:-none}', not $version: installed copies would refuse this update"; fail=1
              fi
              file=$(awk -F'\t' -v id="${url##*/}" '{ n = split($4, part, "/"); if (part[n] == id) print $1 }' <<< "$listing")
              if [ -z "$file" ]; then
                echo "::error::latest.json's $platform entry points at $url, which is not a file of $tag"; fail=1
              else
                echo "latest.json: $platform -> $file"
              fi
            done
            if [ "$fail" -ne 0 ]; then jq '.platforms | keys' release-check/latest.json || true; fi
          fi
          if has models.json; then
            mkdir -p release-check
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern models.json --dir release-check --clobber
            cmp -s release-check/models.json catalog/models.json || { echo "::error::models.json on $tag differs from catalog/models.json"; fail=1; }
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::$tag stays a draft: fix the problems above, then run this workflow again."
            exit 1
          fi
          # The page's notes: the CHANGELOG.md entry as written, then where to download.
          # latest.json keeps the plain text the build gave it (publish job, Release notes).
          python3 -I scripts/release_notes.py page "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Published $tag."
