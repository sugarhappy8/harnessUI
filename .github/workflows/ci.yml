name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's default Ubuntu mirror (azure.archive.ubuntu.com) stopped answering on
      # 2026-11-11 and this step hung for 37 minutes. Each apt-get call has a time limit;
      # when the default mirror fails, Ubuntu's own archive is used, then the kernel.org
      # mirror. apt checks every package against Ubuntu's signing keys whatever the mirror.
      - name: System libraries for Tauri
        timeout-minutes: 30
        run: |
          apt_get() { sudo timeout --kill-after=10 "$1" apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120 -o APT::Update::Error-Mode=any "${@:2}"; }
          install() { apt_get 150 update && apt_get 400 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev; }
          use_mirror() {
            echo "The package install failed or timed out; switching apt to $1"
            printf '%s\tpriority:1\n' "$1" | sudo tee /etc/apt/apt-mirrors.txt
            for list in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$list" ]; then sudo sed -i -E "s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#$1#g" "$list"; fi
            done
          }
          install && exit 0
          use_mirror https://archive.ubuntu.com/ubuntu/
          install && exit 0
          use_mirror https://mirrors.edge.kernel.org/ubuntu/
          install && exit 0
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: bash scripts/check-spawn.sh
      # Every crate and npm package in the release targets must be listed with its license.
      - run: python3 scripts/notices.py --check
      # The macOS llama.cpp build needs a Mac; its plan, file names and checks do not.
      - run: python3 scripts/fetch_llama_test.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache llama.cpp and the test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/llama
            .cache/models
          key: contract-linux-${{ hashFiles('llama.lock.json', 'scripts/fetch_test_model.py') }}
      - name: Fetch the Linux llama-server and the test model
        run: |
          python3 scripts/fetch_llama.py linux
          echo "LLAMA_SERVER_BIN=$PWD/.cache/llama-linux/llama-server" >> "$GITHUB_ENV"
          echo "TEST_GGUF=$(python3 scripts/fetch_test_model.py .cache/models)" >> "$GITHUB_ENV"
      - name: Workspace tests (with llama-server contract tests)
        # Every crate's tests run even when one crate fails, so one run shows everything
        # that is wrong. The step still fails.
        run: cargo test --workspace --no-fail-fast
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    name: Build installer (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            test-target: x86_64-pc-windows-msvc
            args: --bundles nsis --no-sign
          # One disk image for every Mac: the app and the llama.cpp sidecars are built for
          # Apple silicon and for Intel and joined (ARCHITECTURE.md 7.1). The runner is an
          # Apple silicon Mac, so the tests run on that half; the Intel half is run by the
          # intel-mac job below.
          - name: macOS
            os: macos-26
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            test-target: aarch64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache llama.cpp runtime and the test model
        id: llama-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/llama
            .cache/models
            src-tauri/binaries
          key: llama-${{ matrix.target }}-${{ hashFiles('llama.lock.json', 'scripts/fetch_llama.py', 'scripts/fetch_test_model.py') }}
      - name: llama.cpp runtime (Windows, pinned Vulkan + CPU build)
        if: runner.os == 'Windows'
        run: python scripts/fetch_llama.py windows
      # The reported bug: a PC whose graphics driver came without the Vulkan runtime
      # (vulkan-1.dll). llama.cpp's Vulkan library then cannot be loaded and no GPU is
      # listed, without any message. The app puts its own copy at the END of llama-server's
      # PATH. This loads the Vulkan library the way Windows resolves its dependencies,
      # once without and once with that PATH entry, each in a fresh process. A runner
      # without a system Vulkan runtime is the same situation as that PC.
      - name: The Vulkan library loads with the app's copy of the Vulkan runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = (Resolve-Path src-tauri/resources/llama/main).Path
          $dll = Join-Path $dir 'ggml-vulkan.dll'
          $fallback = Join-Path $dir 'vulkan'
          if (-not (Test-Path (Join-Path $fallback 'vulkan-1.dll'))) { throw "The app's copy of vulkan-1.dll is missing from $fallback" }
          $system = Test-Path "$env:SystemRoot\System32\vulkan-1.dll"
          Write-Host "This runner has its own Vulkan runtime: $system"
          $load = "try { [void][System.Runtime.InteropServices.NativeLibrary]::Load('$dll'); 'loaded' } catch { 'failed: ' + `$_.Exception.Message }"
          $without = pwsh -NoProfile -Command $load
          Write-Host "Without the app's copy: $without"
          $env:PATH = "$env:PATH;$fallback"
          $with = pwsh -NoProfile -Command $load
          Write-Host "With the app's copy last on PATH: $with"
          if ($with -ne 'loaded') { throw "ggml-vulkan.dll does not load even with the app's Vulkan runtime on PATH: $with" }
          if (-not $system -and $without -eq 'loaded') { throw "Expected the load to fail without any Vulkan runtime; the check is not testing what it should." }
      - name: llama.cpp runtime (macOS, built from the pinned commit for both processors)
        if: runner.os == 'macOS' && steps.llama-cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_llama.py macos
      - name: Contract-test environment
        shell: bash
        run: |
          echo "TEST_GGUF=$(python3 scripts/fetch_test_model.py .cache/models)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "LLAMA_SERVER_BIN=$(cygpath -w "$PWD/src-tauri/resources/llama/main/llama-server.exe")" >> "$GITHUB_ENV"
          else
            mkdir -p .cache/llama-mac
            cp src-tauri/binaries/llama-server-universal-apple-darwin .cache/llama-mac/llama-server
            cp src-tauri/binaries/llama-fit-params-universal-apple-darwin .cache/llama-mac/llama-fit-params
            echo "LLAMA_SERVER_BIN=$PWD/.cache/llama-mac/llama-server" >> "$GITHUB_ENV"
          fi
      # The browser tool's end-to-end tests run against the runner's Chrome on Windows,
      # which is the only check of its pipe mode there.
      - name: Browser end-to-end tests on (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HARNESS_BROWSER_E2E=1" >> "$GITHUB_ENV"
      - name: Workspace tests (${{ matrix.name }}, with llama-server contract tests)
        # Every crate's tests run even when one crate fails, so one run shows everything
        # that is wrong on this system. The step still fails.
        run: cargo test --workspace --no-fail-fast --target ${{ matrix.test-target }}
      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
      # Every program in the bundle (the app and the two llama.cpp sidecars) must contain
      # both processors, or the app would not start on one kind of Mac. libgit2's HTTPS
      # links OpenSSL on macOS: it must be built in, never loaded from Homebrew or anywhere
      # else outside the system, on either processor (ARCHITECTURE.md 9.3, build note).
      - name: App bundle is universal and links system libraries only (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          for program in "$app"/Contents/MacOS/*; do
            echo "$program: $(lipo -archs "$program")"
          done
          python3 scripts/fetch_llama.py check-macos-app "$app"
      - name: Installer size check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "Installer: $($exe.Name) $mb MB"
          # The app's copy of the Vulkan runtime must be among the bundled resources.
          # Looked for in the build's copy of the resources, then in the installer itself.
          $copied = Get-ChildItem target/release -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'llama[\\/]main[\\/]vulkan' } | Select-Object -First 1
          if ($copied) {
            Write-Host "Vulkan runtime bundled: $($copied.FullName)"
          } else {
            $listing = & 7z l $exe.FullName 2>$null | Out-String
            if ($listing -notmatch 'vulkan-1\.dll') { throw "vulkan/vulkan-1.dll was not bundled with the llama.cpp runtime." }
            Write-Host "Vulkan runtime found inside the installer."
          }
          if ($exe.Length -gt 150MB) { throw "The installer is $mb MB, over the 150 MB budget. Something large was bundled (see ARCHITECTURE.md 16)." }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The Apple silicon runner above cannot run the Intel half of the disk image. This job
  # opens the same disk image on a Mac with an Intel processor and runs it there: the
  # app's own binary, the sidecars, and a short generation on the CPU, which is what Auto
  # uses on these Macs (ARCHITECTURE.md 7.2).
  intel-mac:
    name: Intel Mac smoke test
    needs: build
    # Also when only the Windows build failed; without a disk image the download fails.
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dmg
      - name: Cache the test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: test-model-${{ hashFiles('scripts/fetch_test_model.py') }}
      - name: Run the disk image's programs on an Intel processor
        shell: bash
        run: bash scripts/intel-mac-smoke.sh dmg/*.dmg "$(python3 scripts/fetch_test_model.py .cache/models)"
