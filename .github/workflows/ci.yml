name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: bash scripts/check-spawn.sh
      # Every crate and npm package in the release targets must be listed with its license.
      - run: python3 scripts/notices.py --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache llama.cpp and the test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/llama
            .cache/models
          key: contract-linux-${{ hashFiles('llama.lock.json', 'scripts/fetch_test_model.py') }}
      - name: Fetch the Linux llama-server and the test model
        run: |
          python3 scripts/fetch_llama.py linux
          echo "LLAMA_SERVER_BIN=$PWD/.cache/llama-linux/llama-server" >> "$GITHUB_ENV"
          echo "TEST_GGUF=$(python3 scripts/fetch_test_model.py .cache/models)" >> "$GITHUB_ENV"
      - name: Workspace tests (with llama-server contract tests)
        run: cargo test --workspace
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    name: Build installer (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --bundles nsis --no-sign
          - name: macOS
            os: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache llama.cpp runtime and the test model
        id: llama-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/llama
            .cache/models
            src-tauri/binaries
          key: llama-${{ matrix.target }}-${{ hashFiles('llama.lock.json', 'scripts/fetch_llama.py', 'scripts/fetch_test_model.py') }}
      - name: llama.cpp runtime (Windows, pinned Vulkan + CPU build)
        if: runner.os == 'Windows'
        run: python scripts/fetch_llama.py windows
      - name: llama.cpp runtime (macOS, built from the pinned commit)
        if: runner.os == 'macOS' && steps.llama-cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_llama.py macos
      - name: Contract-test environment
        shell: bash
        run: |
          echo "TEST_GGUF=$(python3 scripts/fetch_test_model.py .cache/models)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "LLAMA_SERVER_BIN=$(cygpath -w "$PWD/src-tauri/resources/llama/main/llama-server.exe")" >> "$GITHUB_ENV"
          else
            mkdir -p .cache/llama-mac
            cp src-tauri/binaries/llama-server-aarch64-apple-darwin .cache/llama-mac/llama-server
            cp src-tauri/binaries/llama-fit-params-aarch64-apple-darwin .cache/llama-mac/llama-fit-params
            echo "LLAMA_SERVER_BIN=$PWD/.cache/llama-mac/llama-server" >> "$GITHUB_ENV"
          fi
      # The browser tool's end-to-end tests run against the runner's Chrome on Windows,
      # which is the only check of its pipe mode there.
      - name: Browser end-to-end tests on (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HARNISS_BROWSER_E2E=1" >> "$GITHUB_ENV"
      - name: Workspace tests (${{ matrix.name }}, with llama-server contract tests)
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
      - name: Installer size check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "Installer: $($exe.Name) $mb MB"
          if ($exe.Length -gt 150MB) { throw "The installer is $mb MB, over the 150 MB budget. Something large was bundled (see ARCHITECTURE.md 16)." }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
