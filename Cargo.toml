[workspace]
resolver = "3"
members = [
    "crates/policy",
    "crates/store",
    "crates/runtime",
    "crates/models",
    "crates/mcp-host",
    "crates/tools",
    "crates/agent",
    "crates/computer",
    "crates/browser",
    "src-tauri",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sugarhappy8/harnissUI"
publish = false

[workspace.dependencies]
# Internal crates
policy = { path = "crates/policy" }
store = { path = "crates/store" }
runtime = { path = "crates/runtime" }
models = { path = "crates/models" }
mcp-host = { path = "crates/mcp-host" }
tools = { path = "crates/tools" }
agent = { path = "crates/agent" }
computer = { path = "crates/computer" }
browser = { path = "crates/browser" }

# Shell. Pinned to the 2.x line: a 3.0 alpha is published and `cargo search` shows it.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-clipboard-manager = "2.5"

# Async, serialisation, errors
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = { version = "0.7.20", features = ["rt", "io"] }
tokio-stream = "0.1"
bytes = "1"
async-trait = "0.1"
url = "2"
libc = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# HTTP
# native-tls: the OS TLS stack (SChannel / Security.framework) and the OS certificate store;
# avoids the aws-lc-rs assembler requirement on Windows CI.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "charset", "system-proxy", "query"] }
http = "1"

# MCP
rmcp = { version = "3.9", features = ["client", "server", "macros", "schemars", "transport-child-process", "which-command", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
schemars = "1"

# Storage and secrets
rusqlite = { version = "0.41", features = ["bundled"] }
keyring-core = "1.0"

# Processes
process-wrap = { version = "10", features = ["tokio1"] }
which = "8"

# Text and data
jsonschema = { version = "0.61", default-features = false }
sha2 = "0.11"
similar = "3.2"
dunce = "1.0"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
minisign-verify = "0.2"
pdf-extract = "0.12"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde-saphyr = "2.1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
tempfile = "3"
# Git fallback when system git is missing (ARCHITECTURE.md 9.3, 18): libgit2 built from the
# vendored source with HTTPS (WinHTTP on Windows, SecureTransport on macOS); no ssh.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }

# Browser tool (ARCHITECTURE.md 9.3, 18): WebSocket client for the optional loopback-port
# CDP mode only; client handshake, no TLS, no default features (pure Rust).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Computer use (ARCHITECTURE.md 9.3). Only the computer crate uses these.
# Screenshot resizing (bicubic, as llama.cpp resizes Qwen-VL images) and PNG encoding;
# already in the lock through Tauri, no default features.
image = { version = "0.25", default-features = false, features = ["png"] }
# Windows monitor capture (9.3 names it); compiled on Windows only.
xcap = { version = "0.9.10", default-features = false }
# Keyboard input on Windows and macOS, pointer input on macOS (9.3); called on the main
# thread only. No default features: the X11 backend is never used.
enigo = { version = "0.6.1", default-features = false }
# macOS only: ScreenCaptureKit, CoreGraphics and AppKit bindings from the objc2 family
# Tauri already uses (no Swift build step, unlike the screencapturekit crate).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-screen-capture-kit = { version = "0.3", default-features = false }

# Dev
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Dev builds keep debug info for our own crates only: dependencies without it take about
# a third of the disk and link faster.
[profile.dev.package."*"]
debug = false
