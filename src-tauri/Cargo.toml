[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first agentic desktop app for local AI models"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2"
store = { workspace = true }
runtime = { workspace = true }
agent = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
models = { workspace = true }
policy = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
dunce = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Reading the Windows build number (ROCm needs Windows 11 25H2); same major as Tauri.
windows = { version = "0.62", features = ["Win32_System_Registry"] }

[lints]
workspace = true
