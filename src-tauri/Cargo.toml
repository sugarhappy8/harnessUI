[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first agentic desktop app for local AI models"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2"
store = { workspace = true }
runtime = { workspace = true }
agent = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
models = { workspace = true }
policy = { workspace = true }
tools = { workspace = true }
browser = { workspace = true }
search = { workspace = true }
# Reverse engineering with rea (item5-spec.md): pinned downloads, rea's process, the `reverse` server.
reverse = { workspace = true }
computer = { workspace = true }
mcp-host = { workspace = true }
# Signed, opt-in updates (registered only when the build carries the updater key).
tauri-plugin-updater = { workspace = true }
# The agent and MCP host traits are async-trait traits; the app implements them.
async-trait = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
dunce = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# 0.0.6: WebP pictures become PNG before they reach the model (attachments.rs): llama-server
# reads WebP only through ffmpeg, which the app never lets it start. Pure Rust decoder.
image = { workspace = true, features = ["webp"] }
# 0.0.5 sharing proxy (share/proxy.rs): a small HTTP/1 server on a loopback port that
# checks, rebuilds and forwards other apps' requests. hyper, hyper-util and http-body-util
# are already in the lock through reqwest; the server feature adds only httpdate.
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.5", features = ["channel"] }
http = { workspace = true }
bytes = { workspace = true }
# 0.0.5 setup text for Codex (share/setup_text.rs) is written with the TOML serialiser.
toml = { workspace = true, features = ["display"] }

[target.'cfg(windows)'.dependencies]
# Reading the Windows build number (ROCm needs Windows 11 25H2); same major as Tauri.
# 0.0.6 Win32_Storage_FileSystem: a coding app's file identity (outside_agent/identity.rs).
windows = { version = "0.62", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the overlay window's number so the computer-use injector can look through it.
objc2 = { workspace = true }
